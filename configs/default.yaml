# Default WRDNet training configuration
# Phase 0: Warmup (joint training without domain adaptation)

model:
  dehazeformer_variant: 'T'
  yolo_variant: 's'
  pretrained: true
  num_classes: 8          # Cityscapes detection classes (0=person..7=bicycle)
  replace_head: true      # Replace 80-class COCO head with 8-class head (semantics must match labels)
  input_size_dehaze: [384, 768]   # DehazeFormer resolution (2:1, lighter than detect)
  input_size_detect: [512, 1024]  # YOLO resolution (2:1 aspect ratio, Height, Width)
  fsg_channels: [256, 256, 512]  # P3, P4, P5 channels (verified from YOLOv11s)
  use_fsg: true
  use_depth: true
  use_dg_fsg: true  # DG-FSG enabled for Phase 1 (depth-guided fusion)

# Data configuration
data:
  data_root: 'data'
  # Multi-density fog training: the dataset already contains beta_0.005,
  # beta_0.01, beta_0.02 for every image. Training on all 3 densities triples
  # the data (2975→8925) and makes the model robust to fog severity.
  fog_density: ['0.005', '0.01', '0.02']
  input_size: [512, 1024]  # (H, W) — 2:1 aspect ratio
  # Use Cityscapes train + val for training (we evaluate on ACDC/Foggy Driving,
  # so we don't need to hold out Cityscapes val). test has no labels.
  train_splits: ['train', 'val']
  real_datasets: ['acdc']  # ONLY ACDC for DA training. Zurich is for evaluation only!

training:
  phase: 'warmup'
  epochs: 30
  batch_size: 16
  # force_batch_size overrides the auto-selection in modal_train.py for PHASE 1
  # only (Phase 0 uses the GPU-memory-aware auto-selector). On H100 (80GB),
  # bs=8 → 8 images/step (6 synth + 2 real), ~50GB, safe headroom. bs=12 would
  # be ~76GB (risky with DG-FSG depth decoder added on top of the DCT real path).
  force_batch_size: 8
  num_workers: 4
  lr: 1.0e-3
  optimizer: 'AdamW'
  weight_decay: 1.0e-4
  scheduler: 'cosine'
  warmup_epochs: 5

  # Loss weights — reduced auxiliary weights so detection (weight 1.0) is prioritized
  lambda_rest: 0.1      # Reduced from 0.5
  lambda_depth: 0.05    # Reduced from 0.1
  lambda_entropy: 0.01
  lambda_domain: 0.005  # Reduced from 0.01 → 0.005 (all-3 test: DCT MMD must not
                        # overpower detection. The "overpowering effect" is the
                        # main risk — DCT pulls features for distribution matching
                        # while YOLO wants localization. Lower weight = gentler.)
  lambda_fsg: 0.005     # Reduced from 0.01 → 0.005 (FSG-consistency, same reason)

  # Domain warmup — linearly ramp lambda_domain from 0 to its value over first N epochs.
  # Extended 10 → 25: gives the detector time to fully adapt to the FSG before
  # DA gradients start pulling (prevents the Phase 1 oscillation).
  domain_warmup_epochs: 25

  # Logging
  log_interval: 5
  save_interval: 5
  checkpoint_dir: 'experiments/checkpoints'
  log_dir: 'experiments/logs'

  # Early stopping
  early_stopping: true
  early_stopping_patience: 10
  early_stopping_metric: 'mAP@50'

domain_adaptation:
  # TEST 5 (ALL 3 — paper's core hypothesis): FDA + DCT + FSG-consistency.
  # The three modules attack the domain gap at three levels: FDA (input),
  # DCT (feature), FSG-consistency (gate). This is the paper's novelty.
  # Risk: DA losses can overpower detection → lowered lambda_domain and
  # lambda_fsg to 0.005 so they're gentle. DCT real path is heavy → bs=6.
  use_fda: true
  use_dct_align: true
  use_fsg_consistency: true
  use_tta: false

  # BINARY-SEARCH DEBUG FLAG: when true, Phase 1 runs as PURE fine-tuning with
  # ALL DA losses OFF (FDA, DCT, FSG-consistency). FSG stays ON and DehazeFormer
  # stays unfrozen. This isolates whether the mAP-0.0000 crash is caused by the
  # DA losses vs the FSG/unfrozen-DehazeFormer themselves.
  # NOTE: set to FALSE now — we are testing individual DA losses.
  disable_da_losses: false

  # FORCE-FRESH-PHASE1 FLAG: when true, Phase 1 IGNORES any existing Phase 1
  # checkpoints and always loads fresh from Phase 0 + resets the FSG gate to
  # near-identity. This prevents the footgun where stale Phase 1 checkpoints
  # (with random FSG weights) are resumed instead of applying the FSG fix.
  #
  # SCIENTIFIC METHOD: set to TRUE for DA isolation tests. Every test must
  # start from the SAME stable baseline (Phase 0 best.pth, mAP 0.39, FSG
  # near-identity). Resuming from a mid-Phase-1 checkpoint would contaminate
  # the test — if FDA crashes, we couldn't tell if FDA is broken or if it
  # conflicted with the already-shifted FSG weights.
  #
  # NOTE: set to FALSE now — resuming the stabilized DG-FSG run from the latest
  # Phase 1 checkpoint (epoch 4, mAP 0.4482). The depth decoder architecture is
  # unchanged since the restart, so the checkpoints are compatible.
  force_fresh_phase1: false

  # FDA schedule (only active when use_fda: true)
  # Lowered fda_start_epoch to 2 so FDA activates immediately — we only have
  # ~15 credits and can't afford 30 epochs of baseline re-establishment.
  # Gentle beta ramp: 0.01 at epoch 2, 0.02 at epoch 4, 0.03 at epoch 6.
  fda_start_epoch: 2
  fda_beta_schedule:
    - [2, 0.01]
    - [4, 0.02]
    - [6, 0.03]
    - [8, 0.04]

seed: 42
