# Default WRDNet training configuration
# Phase 0: Warmup (joint training without domain adaptation)

model:
  dehazeformer_variant: 'T'
  yolo_variant: 's'
  pretrained: true
  num_classes: 8          # Cityscapes detection classes (0=person..7=bicycle)
  replace_head: true      # Replace 80-class COCO head with 8-class head (semantics must match labels)
  input_size_dehaze: [384, 768]   # DehazeFormer resolution (2:1, lighter than detect)
  input_size_detect: [512, 1024]  # YOLO resolution (2:1 aspect ratio, Height, Width)
  fsg_channels: [256, 256, 512]  # P3, P4, P5 channels (verified from YOLOv11s)
  use_depth: true
  use_dg_fsg: false  # Set to true for E12 (DG-FSG experiment)

# Data configuration
data:
  data_root: 'data'
  # Multi-density fog training: the dataset already contains beta_0.005,
  # beta_0.01, beta_0.02 for every image. Training on all 3 densities triples
  # the data (2975→8925) and makes the model robust to fog severity.
  fog_density: ['0.005', '0.01', '0.02']
  input_size: [512, 1024]  # (H, W) — 2:1 aspect ratio
  # Use Cityscapes train + val for training (we evaluate on ACDC/Foggy Driving,
  # so we don't need to hold out Cityscapes val). test has no labels.
  train_splits: ['train', 'val']
  real_datasets: ['acdc']  # ONLY ACDC for DA training. Zurich is for evaluation only!

training:
  phase: 'warmup'
  epochs: 30
  batch_size: 16
  num_workers: 4
  lr: 1.0e-3
  optimizer: 'AdamW'
  weight_decay: 1.0e-4
  scheduler: 'cosine'
  warmup_epochs: 5

  # Loss weights — reduced auxiliary weights so detection (weight 1.0) is prioritized
  lambda_rest: 0.1      # Reduced from 0.5
  lambda_depth: 0.05    # Reduced from 0.1
  lambda_entropy: 0.01
  lambda_domain: 0.02   # Reduced from 0.1 (prevents instant MMD collapse)
  lambda_fsg: 0.01

  # Domain warmup — linearly ramp lambda_domain from 0 to its value over first N epochs.
  # Extended 10 → 25: gives the detector time to fully adapt to the FSG before
  # DA gradients start pulling (prevents the Phase 1 oscillation).
  domain_warmup_epochs: 25

  # Logging
  log_interval: 5
  save_interval: 5
  checkpoint_dir: 'experiments/checkpoints'
  log_dir: 'experiments/logs'

  # Early stopping
  early_stopping: true
  early_stopping_patience: 10
  early_stopping_metric: 'mAP@50'

domain_adaptation:
  use_fda: false
  use_dct_align: false
  use_fsg_consistency: false
  use_tta: false

  # BINARY-SEARCH DEBUG FLAG: when true, Phase 1 runs as PURE fine-tuning with
  # ALL DA losses OFF (FDA, DCT, FSG-consistency). FSG stays ON and DehazeFormer
  # stays unfrozen. This isolates whether the mAP-0.0000 crash is caused by the
  # DA losses vs the FSG/unfrozen-DehazeFormer themselves.
  disable_da_losses: false

  # FORCE-FRESH-PHASE1 FLAG: when true, Phase 1 IGNORES any existing Phase 1
  # checkpoints and always loads fresh from Phase 0 + resets the FSG gate to
  # near-identity. This prevents the footgun where stale Phase 1 checkpoints
  # (with random FSG weights) are resumed instead of applying the FSG fix.
  force_fresh_phase1: false

  # FDA schedule (only active when use_fda: true)
  fda_start_epoch: 30
  fda_beta_schedule:
    - [30, 0.00]
    - [60, 0.02]
    - [90, 0.04]
    - [120, [0.01, 0.06]]

seed: 42
